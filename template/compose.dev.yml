# Local development, replaces DDEV. Same base image as production.
#   docker compose up                    # PHP + MySQL + Mailpit (built assets)
#   docker compose --profile vite up     # + Vite dev server with HMR
# With COMPOSE_FILE=compose.dev.yml in .env the -f flag is not needed.
# Never rename to compose.override.yml: Compose would merge it into the
# production stack wherever compose.yml runs.

services:
  web:
    build:
      context: .
      target: dev
      args:
        USER_ID: ${USER_ID:-}
        GROUP_ID: ${GROUP_ID:-}
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - .:/var/www/html
    environment:
      CRAFT_COMPOSER_AUTOINSTALL: "true"
      PHP_OPCACHE_ENABLE: "0"
      PHP_DISPLAY_ERRORS: "On"
      CRAFT_APP_ID: ${CRAFT_APP_ID:-CraftCMS--local}
      CRAFT_SECURITY_KEY: ${CRAFT_SECURITY_KEY:?set it in .env (openssl rand -hex 32)}
      PRIMARY_SITE_URL: http://localhost:${WEB_PORT:-8080}
      CRAFT_ENVIRONMENT: dev
      CRAFT_DEV_MODE: "true"
      CRAFT_ALLOW_ADMIN_CHANGES: "true"
      CRAFT_DISALLOW_ROBOTS: "true"
      # No queue container in dev: web requests run jobs, like DDEV.
      CRAFT_RUN_QUEUE_AUTOMATICALLY: "true"
      CRAFT_DB_DRIVER: mysql
      CRAFT_DB_SERVER: db
      CRAFT_DB_PORT: "3306"
      CRAFT_DB_DATABASE: craft
      CRAFT_DB_USER: craft
      CRAFT_DB_PASSWORD: craft
      MAIL_FROM: craft@localhost
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_AUTH: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      # craft-vite pings the internal URL; when the vite profile is off it
      # falls back to the built manifest (build once, see README).
      VITE_MANIFEST: "@webroot/dist/.vite/manifest.json"
      VITE_SERVER_PUBLIC: http://localhost:${WEB_PORT:-8080}/dist/
      VITE_DEV_SERVER_PUBLIC: http://localhost:${VITE_PORT:-5173}
      VITE_DEV_SERVER_INTERNAL: http://vite:5173
      VITE_ERROR_ENTRY: ""
    depends_on:
      db:
        condition: service_healthy

  vite:
    image: node:24-alpine
    profiles: [vite]
    working_dir: /app
    command: sh -c "npm install && exec npm run dev"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/app
      # Linux-native node_modules; the host's macOS binaries don't run here.
      - node_modules:/app/node_modules
    environment:
      VITE_DEV_SERVER_PUBLIC: http://localhost:${VITE_PORT:-5173}

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: craft
      MYSQL_USER: craft
      MYSQL_PASSWORD: craft
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u craft -pcraft --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  db:
  node_modules:
