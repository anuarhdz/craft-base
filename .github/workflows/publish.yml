name: Publish image

on:
  push:
    branches: [main]
  # Weekly rebuild picks up upstream PHP / Debian security patches.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: date
        run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      # amd64 for the servers (miso), arm64 for Apple Silicon.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: PHP_VERSION=${{ matrix.php }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/craft-base:php${{ matrix.php }}
            ghcr.io/${{ github.repository_owner }}/craft-base:php${{ matrix.php }}-${{ steps.date.outputs.today }}
          cache-from: type=gha,scope=php${{ matrix.php }}
          cache-to: type=gha,mode=max,scope=php${{ matrix.php }}

  # GitHub disables schedules in public repos after 60 days without activity.
  # Re-enabling the workflow resets that counter, so the weekly rebuild survives
  # a quiet repo.
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publish.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
